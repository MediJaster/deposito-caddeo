services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mysql_exercise_app
    depends_on:
      - db
    ports:
      - "5000:80"

  db:
    image: mysql:8.0
    container_name: mysql_exercise_db
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: test_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql


volumes:
  db_data: