[project]
name = "rag_or_web_flow"
version = "0.1.0"
description = "rag_or_web_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.165.1,<1.0.0",
    "ddgs>=9.5.4",
    "langchain-qdrant>=0.2.0",
]

[project.scripts]
kickoff = "rag_or_web_flow.main:kickoff"
run_crew = "rag_or_web_flow.main:kickoff"
plot = "rag_or_web_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
